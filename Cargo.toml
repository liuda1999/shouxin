[package]
name = "shouxin"
version = "0.5.0"
edition = "2021"

[features]
default = []
# gguf：纯 CPU 推理（llama.cpp 不编译 CUDA 后端，体积小、无需 GPU 运行时库）
gguf = ["llama-cpp-2"]
# gguf-cuda：需要 GPU 卸载时用（会引入 CUDA 依赖）
gguf-cuda = ["llama-cpp-2", "llama-cpp-2/cuda"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
fastembed = { version = "4.9.1", features = ["ort-download-binaries"] }
sled = "0.34"
hnsw_rs = "0.3"
# 用于取物理核心数：GPU 模式的 CPU 上限按物理核计算，避免超线程把额度放大
num_cpus = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
config = "0.14"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
md5 = "0.7"
pdf-extract = "0.7"
zip = "0.6"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
rand = "0.8"
directories = "5"
rayon = "1"
constant_time_eq = "0.3"
lru = "0.12"
tempfile = "3"
llama-cpp-2 = { version = "=0.1.146", optional = true, default-features = false, features = ["sampler"] }
encoding_rs = "0.8"
bytes = "1"
backoff = "0.4"
futures = "0.3"
sysinfo = "0.32"

[dev-dependencies]

[[bin]]
name = "shouxin-server"
path = "src/shouxin-server.rs"
[[bin]]
name = "bench_gguf"
path = "src/bin/bench_gguf.rs"
required-features = ["gguf"]
