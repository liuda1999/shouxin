# .cargo/config.toml
#
# 本项目默认**纯 CPU 构建**（`--features gguf`），不需要任何 CUDA 配置。
# 只有构建 `--features gguf-cuda` 时才需要指定 CUDA 库路径，而 CUDA 安装位置因机器而异，
# 因此这里**不写死任何路径**，避免把机器相关配置带进仓库。
#
# 需要 GPU 构建时，二选一：
#
#   1) 用环境变量（推荐，不改仓库文件）：
#        export CUDA_PATH="/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.x"
#        export RUSTFLAGS="-C target-cpu=native -L $(cygpath -w "$CUDA_PATH")\\lib\\x64"
#        cargo build --release --features gguf-cuda
#
#   2) 在本机临时取消下面的注释（改动不要提交）：
#
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-L", "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8\\lib\\x64"]
#
# [env]
# CUDA_PATH = "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
